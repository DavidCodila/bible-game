<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garden of Eden</title>
    <style>
        /* Lock viewport and hide scrollbars */
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden; background-color: #000;
        }

        /* Purely for the Menu Text and Button */
        #ui-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            transition: opacity 1s ease-out; /* Smoothly fade the text out */
        }

        /* Style your button however you like */
        h1 { font-size: 3rem; letter-spacing: 5px; margin-bottom: 2rem; }
        
        #start-button {
            padding: 15px 50px;
            font-size: 1.5rem;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <h1>GARDEN OF EDEN</h1>
        <button id="start-button">ENTER</button>
        <div id="status-text">Ready</div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
