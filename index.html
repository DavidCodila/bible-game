<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garden of Eden</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden; background-color: #000;
            user-select: none; -webkit-user-select: none;
        }

        /* The main container */
        #start-page {
            position: fixed; 
            inset: 0; 
            z-index: 9999;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            background-color: #000;
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: opacity 2s ease-out;
            pointer-events: all; /* Ensures clicks aren't ignored */
        }

        h1 { 
            font-size: clamp(2rem, 10vw, 4.5rem); 
            letter-spacing: 20px; 
            font-weight: 200;
            margin-bottom: 3rem;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            text-align: center;
        }
        
        #start-button {
            padding: 16px 70px; 
            font-size: 1rem;
            background: transparent; 
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            cursor: pointer; 
            letter-spacing: 6px;
            text-transform: uppercase; 
            transition: all 0.4s ease;
        }

        #start-button:hover {
            background: white; 
            color: black;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
        }

        /* Pulse animation for the splash text */
        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 0.8; }
            100% { opacity: 0.3; }
        }
        
        #splash-prompt {
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
            animation: pulse 3s infinite ease-in-out;
            cursor: pointer;
            text-align: center;
        }
        
        /* The menu is hidden by default */
        .hidden {
            display: none !important;
            opacity: 0;
        }
        
        #main-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Smooth fade-in for the menu reveal */
        .fade-in {
            animation: fadeIn 1.5s forwards ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    </style>
</head>
<body>
    <div id="start-page">
        <div id="splash-prompt">Click anywhere to begin the journey</div>

        <div id="main-menu" class="hidden">
            <h1>GARDEN OF EDEN</h1>
            <button id="start-button">ENTER</button>
        </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
