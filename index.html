<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garden of Eden</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden; background-color: #000;
            user-select: none; -webkit-user-select: none;
        }

        /* The main container */
        #start-page {
            position: fixed; 
            inset: 0; 
            z-index: 9999;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            background-color: #000;
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: opacity 2s ease-out;
            pointer-events: all; /* Ensures clicks aren't ignored */
        }

        h1 { 
            font-size: clamp(2rem, 10vw, 4.5rem); 
            letter-spacing: 20px; 
            font-weight: 200;
            margin-bottom: 3rem;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            text-align: center;
        }
        
        #start-button {
            padding: 16px 70px; 
            font-size: 1rem;
            background: transparent; 
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            cursor: pointer; 
            letter-spacing: 6px;
            text-transform: uppercase; 
            transition: all 0.4s ease;
        }

        #start-button:hover {
            background: white; 
            color: black;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
        }

        /* Pulse animation for the splash text */
        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 0.8; }
            100% { opacity: 0.3; }
        }
        
        #splash-prompt {
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
            animation: pulse 3s infinite ease-in-out;
            cursor: pointer;
            text-align: center;
        }
        
        /* The menu is hidden by default */
        .hidden {
            display: none !important;
            opacity: 0;
        }
        
        #main-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Smooth fade-in for the menu reveal */
        .fade-in {
            animation: fadeIn 1.5s forwards ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    </style>

    <div id="wind-debug-panel" style="display:none; position:fixed; top:10px; right:10px; background:rgba(0,0,0,0.75); color:#eee; padding:16px; border-radius:8px; font-family:Arial, sans-serif; z-index:9999; user-select:none; min-width:340px;">
        <h3 style="margin:0 0 14px 0; font-size:15px; text-align:center;">Wind Tuning (real-time)</h3>

        <label style="display:block; margin:12px 0 4px;">Wind Speed (overall strength of gusts): <span id="val-speed">12.5</span></label>
        <input type="range" id="slider-speed" min="0" max="60" step="0.25" value="12.5" style="width:300px;"><br>

        <label style="display:block; margin:12px 0 4px;">Wind Frequency (how often gusts occur / gust size): <span id="val-freq">0.095</span></label>
        <input type="range" id="slider-freq" min="0.005" max="1.0" step="0.005" value="0.095" style="width:300px;"><br>

        <label style="display:block; margin:12px 0 4px;">Noise Scale (detail size / turbulence scale): <span id="val-scale">1.6</span></label>
        <input type="range" id="slider-scale" min="0.1" max="8.0" step="0.05" value="1.6" style="width:300px;"><br>

        <label style="display:block; margin:12px 0 4px;">Octaves (number of noise layers / complexity): <span id="val-octaves">5</span></label>
        <input type="range" id="slider-octaves" min="1" max="12" step="1" value="5" style="width:300px;"><br>

        <label style="display:block; margin:12px 0 4px;">Persistence (balance between big vs small details): <span id="val-persist">0.48</span></label>
        <input type="range" id="slider-persist" min="0.1" max="0.9" step="0.01" value="0.48" style="width:300px;"><br>

        <label style="display:block; margin:12px 0 4px;">Lacunarity (how quickly detail frequency increases): <span id="val-lac">2.35</span></label>
        <input type="range" id="slider-lac" min="1.2" max="4.0" step="0.05" value="2.35" style="width:300px;"><br>

        <small style="display:block; margin-top:12px; opacity:0.7; text-align:center;">Press ~ or F1 to toggle</small>
    </div>
</head>
<body>
    <div id="start-page">
        <div id="splash-prompt">Click anywhere to begin the journey</div>

        <div id="main-menu" class="hidden">
            <h1>GARDEN OF EDEN</h1>
            <button id="start-button">ENTER</button>
        </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
