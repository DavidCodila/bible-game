<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garden of Eden</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden; background-color: #000;
            user-select: none; -webkit-user-select: none;
        }

        #start-page {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background-color: #000;
            color: white; font-family: 'Segoe UI', sans-serif;
            /* Match this time to your TS removeAndLock delay */
            transition: opacity 2s ease-out; 
        }

        h1 { 
            font-size: clamp(2rem, 10vw, 4.5rem); 
            letter-spacing: 20px; font-weight: 200;
            margin-bottom: 3rem;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }
        
        #start-button {
            padding: 16px 70px; font-size: 1rem;
            background: transparent; color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            cursor: pointer; letter-spacing: 6px;
            text-transform: uppercase; transition: 0.4s;
        }

        #start-button:hover {
            background: white; color: black;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
        }

        canvas { display: block; }
    </style>
</head>
<body>
    <div id="start-page">
        <h1>GARDEN OF EDEN</h1>
        <button id="start-button">ENTER</button>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
